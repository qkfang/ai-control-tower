id: AI_Control_Tower_App
name: AI_Control_Tower_App
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
    allowedRedirectUris:
      - http://localhost:5173
      - http://127.0.0.1:5173
  data:
    enabled: false
  storage:
    enabled: false
  staticHosting:
    enabled: true
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
    assetAccess: protected
  functions:
    enabled: true
    buildCommand: npm run build
    auth:
      type: application
secrets:
  - name: FABRIC_DATA_AGENT_WORKSPACE_ID
    description: Workspace containing the published data agent, used only by the server.
  - name: FABRIC_DATA_AGENT_ID
    description: Published data agent queried by the chat function.
  - name: FOUNDRY_PROJECT_ENDPOINT
    description: Foundry project endpoint hosting the agents, used only by the server.
